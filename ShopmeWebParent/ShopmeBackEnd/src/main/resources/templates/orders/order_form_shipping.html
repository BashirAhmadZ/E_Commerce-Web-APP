<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<div th:fragment="content" th:remove="tag">
		<div class="form-group row">
			<label class="col-sm-2 col-form-label">Deliver Days:</label>
			<div class="col-sm-10">
				<input type="number" class="form-control mb-1" th:field="*{deliverDays}" required="required" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-2 col-form-label">Expected Deliver Date:</label>
			<div class="col-sm-10">
				<input type="date" class="form-control mb-1" th:field="*{deliverDateOnForm}" required="required" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-2 col-form-label">First Name:</label>
			<div class="col-sm-10">
				<input type="text" class="form-control mb-1" th:field="*{firstName}" required="required" />
			</div>
		</div>
		<div class="form-group row">
			<label class="col-sm-2 col-form-label">last Name:</label>
			<div class="col-sm-10">
				<input type="text" class="form-control mb-1" th:field="*{lastName}" required="required" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-2 col-form-label">Phone Number:</label>
			<div class="col-sm-10">
				<input type="text" class="form-control mb-1" th:field="*{phoneNumber}" required="required" />
			</div>
		</div>
		<div class="form-group row">
			<label class="col-sm-2 col-form-label">Address Line 1:</label>
			<div class="col-sm-10">
				<input type="text" class="form-control mb-1" th:field="*{addressLine1}" required="required" />
			</div>
		</div>
		<div class="form-group row">
			<label class="col-sm-2 col-form-label">Address Line 2:</label>
			<div class="col-sm-10">
				<input type="text" class="form-control mb-1" th:field="*{addressLine2}" required="required" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-2 col-form-label">City:</label>
			<div class="col-sm-10 mt-2">
				<input type="text" class="form-control mb-1" th:field="*{city}" required="required" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-2 col-form-label">Country:</label>
			<div class="col-sm-10 mt-2">
				<select class="form-select mb-1" id="country">
                    <option th:each="aCountry : ${listCountries}" th:value="${aCountry.id}" th:selected="${aCountry.name == order.country}">[[${aCountry.name}]]</option>
                </select>
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-2 col-form-label">State:</label>
			<div class="col-sm-10">
				<input type="text" class="form-control mb-1" th:field="*{state}" list="listStates"/>
				<datalist id="listStates">
                   <!--   <option th:each="aState : ${listStates}" th:value="${aState.name}">[[${aState.name}]]</option> -->
                </datalist>
			</div>
		</div>
	</div>
</body>
</html>
